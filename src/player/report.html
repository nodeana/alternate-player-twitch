<!doctype html>
<html dir="ltr">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title> </title>
  <link rel="stylesheet" href="../shared/common.css" />
  <link rel="stylesheet" href="report.css" />
  <form id="debug-message" hidden>
    <p>
      <span id="debug-messagetext"> </span>
      <a id="debug-messagelink" target="_top" rel="noopener noreferrer"> </a>
    </p>
    <div id="debug-autoreload" hidden>
      <p id="debug-autoreload-text" class="debug-autoreload-text"></p>
      <button
        type="button"
        id="debug-autoreload-cancel"
        data-i18n="F0718"
      ></button>
    </div>
  </form>
  <form id="debug-feedback" hidden>
    <h3 data-i18n="F0700"></h3>
    <div data-i18n="F1501"></div>
    <p data-i18n="F0701"></p>
    <p data-i18n="F0726"></p>
    <p data-i18n="F0727"></p>
    <p data-i18n="F0723"></p>
    <p>
      <label for="debug-feedback-message" data-i18n="F0702"> </label>
      <textarea
        id="debug-feedback-message"
        name="debug-message"
        rows="6"
        minlength="4"
        maxlength="10000"
        spellcheck="true"
        required
        autofocus
      >
      </textarea>
    </p>

    <p>
      <label>
        <span data-i18n="F0703"> </span>
        <span data-i18n="F0728"> </span>
        <input
          name="debug-mail"
          type="email"
          maxlength="254"
          spellcheck="false"
        />
      </label>
    </p>

    <p>
      <span data-i18n="F0704"> </span>
      <label
        for="debug-feedback-showReport"
        class="debug-linkbutton"
        data-i18n="F0705"
      >
      </label>
      .
      <input id="debug-feedback-showReport" type="checkbox" hidden />
      <textarea
        name="debug-report"
        rows="15"
        spellcheck="false"
        required
        readonly
      >
      </textarea>
      <a
        href="https://coolcmd.github.io/privacy.html"
        target="_blank"
        rel="noopener noreferrer"
        data-i18n="F0706"
      >
      </a>
      .
    </p>

    <p>
      <button type="submit" data-i18n="F0707"></button>
      <button type="reset" data-i18n="F0718"></button>
    </p>
    <input name="debug-typeData" type="hidden" value="feedback" />
  </form>
  <form id="debug-error" hidden>
    <h3 data-i18n="F0708"></h3>
    <p>
      <span data-i18n="F0712"> </span>
      <label
        for="debug-error-showReport"
        class="debug-linkbutton"
        data-i18n="F0705"
      >
      </label>
      .
      <input id="debug-error-showReport" type="checkbox" hidden />
      <textarea
        name="debug-report"
        rows="15"
        spellcheck="false"
        required
        readonly
      >
      </textarea>
      <a
        href="https://coolcmd.github.io/privacy.html"
        target="_blank"
        rel="noopener noreferrer"
        data-i18n="F0706"
      >
      </a>
      .
    </p>

    <p data-i18n="F0710"></p>
    <p>
      <label for="debug-error-message" data-i18n="F0715"> </label>
      <textarea
        id="debug-error-message"
        name="debug-message"
        rows="3"
        maxlength="10000"
        spellcheck="true"
      >
      </textarea>
    </p>

    <p>
      <label>
        <span data-i18n="F0703"> </span>
        <span data-i18n="F0728"> </span>
        <input
          name="debug-mail"
          type="email"
          maxlength="254"
          spellcheck="false"
        />
      </label>
    </p>

    <p>
      <button type="submit" autofocus data-i18n="F0707"></button>
    </p>
    <input name="debug-typeData" type="hidden" value="error" />
  </form>
  <form id="debug-sendprogress" hidden>
    <p>
      <span data-i18n="F0717"> </span>
      <progress id="debug-sendprogress2"></progress>
    </p>
    <button type="submit" autofocus data-i18n="F0718"></button>
  </form>
  <form id="debug-sendfailed" hidden>
    <p data-i18n="F0719"></p>
    <button type="submit" autofocus data-i18n="F0720"></button>
    <button type="reset" data-i18n="F0718"></button>
  </form>
  <form id="debug-browseroutdated" hidden>
    <p data-i18n="F0730"></p>
  </form>
  <form id="debug-versionoutdated" hidden>
    <p data-i18n="F0729"></p>
  </form>
</html>
